<!doctype html>
<!-- FO4 Lightbox splash artwork (original, drawn in code: no game imagery). Rendered to launcher/splash.png at 2x by
     launcher/make_splash.py. The launcher draws the live parts on top: status line, version, progress bar (the empty
     strip at the bottom of the card; positions in Launcher.cs SplashWindow). Card 720 x 420 at (40, 40). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  body { width: 800px; height: 500px; position: relative; overflow: hidden;
    font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: absolute; left: 40px; top: 40px; width: 720px; height: 420px; border-radius: 16px; overflow: hidden;
    background: #0c0e12;
    box-shadow: 0 26px 60px rgba(0, 0, 0, .55), 0 8px 22px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .07); }
  canvas { position: absolute; left: 0; top: 0; width: 720px; height: 420px; }
  .rim { position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), inset 0 0 0 1px rgba(255, 255, 255, .035); }
  .txt { position: absolute; left: 46px; top: 58px; }
  .kicker { color: #e8b04a; font: 600 12px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; letter-spacing: .38em; }
  .word { margin: 4px 0 0 -3px; font-size: 70px; line-height: 1.02; letter-spacing: -.025em; color: #f5f2eb; white-space: nowrap; }
  .word .l { font-weight: 250; }
  .word .b { font-weight: 700; background: linear-gradient(180deg, #ffe6ad 0%, #f0bd5c 48%, #c8892b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(232, 176, 74, .28)); }
  .tag { margin-top: 16px; color: #aeb7c3; font: 400 15.5px/1.5 'Segoe UI Variable Text', 'Segoe UI', sans-serif; width: 300px; }
  .tag b { color: #e9e4da; font-weight: 600; }
  .feat { margin-top: 20px; color: #7e8896; font: 600 10.5px 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
    letter-spacing: .2em; text-transform: uppercase; }
  .feat i { font-style: normal; color: #e8b04a; opacity: .7; margin: 0 .55em; }
  .sep { position: absolute; left: 46px; right: 46px; top: 344px; height: 1px;
    background: linear-gradient(90deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03) 70%, rgba(255, 255, 255, 0)); }
  .credit { position: absolute; left: 46px; top: 397px; color: #5f6875; font: 500 10.5px 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
    letter-spacing: .04em; }
  .credit2 { left: auto; right: 46px; }
</style>
</head>
<body>
<div class="card">
  <canvas id="c" width="1440" height="840"></canvas>
  <div class="txt">
    <div class="kicker">FO4 &nbsp;·&nbsp; NIF VIEWER</div>
    <div class="word"><span class="l">Light</span><span class="b">box</span></div>
    <div class="tag">Meshes, materials and whole cells,<br>lit <b>the way the game lights them</b>.</div>
    <div class="feat">Weather<i>·</i>Imagespace<i>·</i>Cells<i>·</i>Animation</div>
  </div>
  <div class="sep"></div>
  <div class="credit">Made by Bman &nbsp;·&nbsp; GPL-3.0 &nbsp;·&nbsp; Built with Claude</div>
  <div class="credit credit2">Reads your own install. Nothing from Bethesda is included.</div>
  <div class="rim"></div>
</div>
<script>
// ---------------------------------------------------------------------------------------------- the artwork
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.scale(2, 2);
const W = 720, H = 420;
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// base: deep slate, a warm sun-side glow top right, a cool sky-side light bottom left
g.fillStyle = '#0b0d11'; g.fillRect(0, 0, W, H);
function glow(x, y, r, stops) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  stops.forEach(([o, c]) => gr.addColorStop(o, c));
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
glow(640, 40, 520, [[0, 'rgba(232,160,70,.30)'], [.35, 'rgba(200,120,50,.12)'], [1, 'rgba(0,0,0,0)']]);
glow(80, 430, 420, [[0, 'rgba(60,110,170,.20)'], [.5, 'rgba(40,70,120,.07)'], [1, 'rgba(0,0,0,0)']]);
glow(540, 230, 260, [[0, 'rgba(255,190,90,.16)'], [1, 'rgba(0,0,0,0)']]);

// the scene's geometry: a camera looking at a floor plane, the cube floating above it
const VX = 545, HZ = 236;                 // vanishing point / horizon
const cube = { x: 552, y: 176, s: 70 };   // centre of the cube's middle vertex, edge length on screen
const sun = { x: 672, y: 70 };

// sky arc: the sun's path across the day, with hour ticks (the viewer's time-of-day dial)
g.save();
g.beginPath(); g.rect(372, 0, W - 372, H); g.clip();
g.strokeStyle = 'rgba(255,255,255,.10)'; g.lineWidth = 1; g.setLineDash([2, 5]);
const arc = { cx: 552, cy: 300, rx: 236, ry: 228 };
g.beginPath(); g.ellipse(arc.cx, arc.cy, arc.rx, arc.ry, 0, Math.PI * 1.06, Math.PI * 1.94); g.stroke();
g.setLineDash([]);
for (let h = 0; h <= 12; h++) {
  const a = Math.PI * (1.06 + .88 * h / 12);
  const x = arc.cx + arc.rx * Math.cos(a), y = arc.cy + arc.ry * Math.sin(a);
  const nx = Math.cos(a), ny = Math.sin(a) * arc.rx / arc.ry, nl = Math.hypot(nx, ny);
  const len = h % 3 === 0 ? 7 : 3.5;
  g.strokeStyle = h % 3 === 0 ? 'rgba(255,215,150,.32)' : 'rgba(255,255,255,.14)';
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + nx / nl * len, y + ny / nl * len); g.stroke();
}
g.restore();
// where the sun sits on that arc: mid-afternoon
const sa = Math.PI * (1.06 + .88 * 8.4 / 12);
sun.x = arc.cx + arc.rx * Math.cos(sa); sun.y = arc.cy + arc.ry * Math.sin(sa);

// god rays from the sun across the scene
g.save();
g.globalCompositeOperation = 'lighter';
for (let i = 0; i < 9; i++) {
  const ang = Math.PI * (0.62 + i * 0.045 + (rnd() - .5) * .02);
  const len = 560, wid = 10 + rnd() * 34;
  const ex = sun.x + Math.cos(ang) * len, ey = sun.y + Math.sin(ang) * len;
  const px = -Math.sin(ang), py = Math.cos(ang);
  const gr = g.createLinearGradient(sun.x, sun.y, ex, ey);
  const a = .035 + rnd() * .05;
  gr.addColorStop(0, `rgba(255,205,120,${a * 1.6})`); gr.addColorStop(.45, `rgba(255,190,100,${a})`); gr.addColorStop(1, 'rgba(255,180,90,0)');
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(sun.x, sun.y);
  g.lineTo(ex + px * wid, ey + py * wid); g.lineTo(ex - px * wid, ey - py * wid); g.closePath(); g.fill();
}
g.restore();

// the sun: a hot core with bloom
glow(sun.x, sun.y, 70, [[0, 'rgba(255,240,205,.85)'], [.08, 'rgba(255,214,140,.65)'], [.35, 'rgba(240,170,80,.18)'], [1, 'rgba(0,0,0,0)']]);
g.fillStyle = '#fff6e0'; g.beginPath(); g.arc(sun.x, sun.y, 4.2, 0, Math.PI * 2); g.fill();
// an anamorphic streak through the sun, like a lens catching it
g.save();
g.globalCompositeOperation = 'lighter';
for (const [len, h, a] of [[150, 1.1, .5], [90, 3, .15]]) {
  const gr = g.createLinearGradient(sun.x - len, 0, sun.x + len, 0);
  gr.addColorStop(0, 'rgba(255,200,120,0)'); gr.addColorStop(.5, `rgba(255,226,170,${a})`); gr.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = gr; g.fillRect(sun.x - len, sun.y - h / 2, len * 2, h);
}
g.restore();

// floor: a perspective grid fading into the distance and toward the sides
function floorY(depth) { return HZ + 190 / depth; }   // depth 1 = nearest row
g.save();
g.beginPath(); g.rect(300, HZ, W - 300, H - HZ); g.clip();
const fg = g.createLinearGradient(0, HZ, 0, H);
fg.addColorStop(0, 'rgba(255,200,120,.05)'); fg.addColorStop(1, 'rgba(0,0,0,.0)');
g.fillStyle = fg; g.fillRect(300, HZ, W - 300, H - HZ);
for (let k = -26; k <= 26; k++) {                      // lines toward the vanishing point
  const x0 = VX + k * 46;
  const edge = Math.max(0, 1 - Math.abs(k) / 14);
  if (edge <= 0) continue;
  const gr = g.createLinearGradient(0, HZ, 0, H);
  gr.addColorStop(0, 'rgba(255,215,160,0)'); gr.addColorStop(.35, `rgba(255,215,160,${.10 * edge})`); gr.addColorStop(1, `rgba(255,215,160,${.16 * edge})`);
  g.strokeStyle = gr; g.lineWidth = 1;
  g.beginPath(); g.moveTo(VX + (x0 - VX) * 0.02, HZ); g.lineTo(x0 + (x0 - VX) * 1.6, H + 40); g.stroke();
}
for (let d = 1; d < 40; d *= 1.32) {                    // rows across
  const y = floorY(d * 1.12);
  if (y > H) continue;
  const a = Math.min(.16, .30 / d);
  const gr = g.createLinearGradient(330, 0, W, 0);
  gr.addColorStop(0, 'rgba(255,215,160,0)'); gr.addColorStop(.45, `rgba(255,215,160,${a})`); gr.addColorStop(1, `rgba(255,215,160,${a * .5})`);
  g.strokeStyle = gr; g.beginPath(); g.moveTo(330, y); g.lineTo(W, y); g.stroke();
}
g.restore();
// horizon haze
glow(VX, HZ, 300, [[0, 'rgba(255,200,130,.10)'], [1, 'rgba(0,0,0,0)']]);

// cube geometry (isometric): six outline points around the middle vertex
const c30 = Math.cos(Math.PI / 6), s30 = Math.sin(Math.PI / 6);
function cubePts(cx, cy, s, flip = 1) {
  const P = (dx, dy) => [cx + dx, cy + dy * flip];
  return { top: P(0, -s), ur: P(s * c30, -s * s30), ul: P(-s * c30, -s * s30), mid: P(0, 0),
    lr: P(s * c30, s * s30), ll: P(-s * c30, s * s30), bot: P(0, s) };
}
function poly(pts, fill) { g.beginPath(); g.moveTo(...pts[0]); for (const p of pts.slice(1)) g.lineTo(...p); g.closePath(); g.fillStyle = fill; g.fill(); }

// dust in the light: soft bokeh along the rays
g.save();
g.globalCompositeOperation = 'lighter';
for (let i = 0; i < 70; i++) {
  const t = rnd(), sp = (rnd() - .5) * 0.5;
  const ang = Math.PI * (0.62 + 0.36 * rnd());
  const d = 40 + t * 430;
  const x = sun.x + Math.cos(ang) * d + sp * 30, y = sun.y + Math.sin(ang) * d;
  if (x < 330 || y > HZ + 70) continue;
  const r = rnd() < .85 ? .6 + rnd() * 1.3 : 2.5 + rnd() * 4;
  const a = r > 2 ? .05 + rnd() * .07 : .2 + rnd() * .45;
  const gr = g.createRadialGradient(x, y, 0, x, y, r * 2);
  gr.addColorStop(0, `rgba(255,228,180,${a})`); gr.addColorStop(1, 'rgba(255,228,180,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 2, 0, Math.PI * 2); g.fill();
}
g.restore();

// shadow on the floor, cast away from the sun (down-left), soft
const floorAt = cube.y + cube.s + 26;
g.save();
g.filter = 'blur(10px)';
g.fillStyle = 'rgba(0,0,0,.55)';
g.beginPath(); g.ellipse(cube.x - 58, floorAt + 6, 92, 15, -0.08, 0, Math.PI * 2); g.fill();
g.filter = 'blur(4px)';
g.fillStyle = 'rgba(0,0,0,.45)';
g.beginPath(); g.ellipse(cube.x - 16, floorAt + 2, 46, 8, -0.05, 0, Math.PI * 2); g.fill();
g.restore();

// reflection in the floor (the cube mirrored about the floor line, fading out)
{
  const R = cubePts(cube.x, 2 * floorAt - cube.y, cube.s, -1);
  g.save();
  g.globalAlpha = .18;
  poly([R.ul, R.mid, R.bot, R.ll], '#d9952e');
  poly([R.mid, R.ur, R.lr, R.bot], '#7a4c16');
  g.restore();
  const fade = g.createLinearGradient(0, floorAt, 0, floorAt + 110);
  fade.addColorStop(0, 'rgba(11,13,17,.15)'); fade.addColorStop(1, 'rgba(11,13,17,1)');
  g.fillStyle = fade; g.fillRect(380, floorAt + 1, 340, 130);
}

// bloom behind the cube
glow(cube.x + 6, cube.y - 6, 150, [[0, 'rgba(255,196,96,.40)'], [.45, 'rgba(232,150,60,.12)'], [1, 'rgba(0,0,0,0)']]);

// the cube: lit top, warm left face, shaded right face, thin bright edges
{
  const C = cubePts(cube.x, cube.y, cube.s);
  let gr = g.createLinearGradient(C.ul[0], C.top[1], C.ur[0], C.mid[1]);
  gr.addColorStop(0, '#fff0c8'); gr.addColorStop(1, '#f6c771');
  poly([C.top, C.ur, C.mid, C.ul], gr);
  gr = g.createLinearGradient(C.ul[0], C.ul[1], C.mid[0], C.bot[1]);
  gr.addColorStop(0, '#e9a447'); gr.addColorStop(1, '#c9862e');
  poly([C.ul, C.mid, C.bot, C.ll], gr);
  gr = g.createLinearGradient(C.mid[0], C.mid[1], C.lr[0], C.lr[1]);
  gr.addColorStop(0, '#9a6220'); gr.addColorStop(1, '#6e4313');
  poly([C.mid, C.ur, C.lr, C.bot], gr);
  // edges
  g.lineJoin = 'round';
  g.strokeStyle = 'rgba(255,244,214,.95)'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(...C.top); g.lineTo(...C.ur); g.lineTo(...C.mid); g.lineTo(...C.ul); g.closePath(); g.stroke();
  g.strokeStyle = 'rgba(255,220,160,.55)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(...C.mid); g.lineTo(...C.bot); g.moveTo(...C.ul); g.lineTo(...C.ll); g.lineTo(...C.bot); g.lineTo(...C.lr); g.lineTo(...C.ur); g.stroke();
  // a specular glint on the top face's far corner and a rim light down the sunlit edge
  glow(C.ur[0] - 4, C.ur[1] + 2, 26, [[0, 'rgba(255,255,240,.55)'], [1, 'rgba(0,0,0,0)']]);
  g.strokeStyle = 'rgba(255,236,190,.55)'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(...C.ur); g.lineTo(...C.lr); g.stroke();
  // wireframe hint: the hidden edges, faint and dashed (a model viewer sees through)
  g.setLineDash([2, 4]); g.strokeStyle = 'rgba(255,230,180,.22)'; g.lineWidth = 1;
  const hb = [C.top[0], C.top[1] + cube.s];        // the hidden back corner
  g.beginPath(); g.moveTo(...hb); g.lineTo(...C.top); g.moveTo(...hb); g.lineTo(...C.ll); g.moveTo(...hb); g.lineTo(...C.lr); g.stroke();
  g.setLineDash([]);
}

// the left side stays calm for the text: a soft darkening from the left edge
{
  const gr = g.createLinearGradient(0, 0, 420, 0);
  gr.addColorStop(0, 'rgba(9,11,14,.92)'); gr.addColorStop(.55, 'rgba(9,11,14,.55)'); gr.addColorStop(1, 'rgba(9,11,14,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 420, H);
}
// the bottom strip for the live status and progress bar: settle it
{
  const gr = g.createLinearGradient(0, 300, 0, H);
  gr.addColorStop(0, 'rgba(9,11,14,0)'); gr.addColorStop(.45, 'rgba(9,11,14,.80)'); gr.addColorStop(1, 'rgba(9,11,14,.96)');
  g.fillStyle = gr; g.fillRect(0, 300, W, H - 300);
}
// vignette + fine grain
glow(W / 2, H / 2, 520, [[.55, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.38)']]);
{
  const img = g.getImageData(0, 0, W * 2, H * 2), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - .5) * 9;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
}
document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body>
</html>
